name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast gate: formatting/lint, types, unit tests. Fails the build on any error.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test

  # End-to-end money path against the real built Node server.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build (node-server)
        run: bun run build
        env:
          NODE_ENV: production
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Run e2e
        run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
